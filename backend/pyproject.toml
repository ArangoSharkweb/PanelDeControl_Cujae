[project]
name = "cujae-tablero"
version = "0.1.0"
description = "Tablero de Control Indicadores Estratégicos CUJAE"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.0",
  "cryptography>=42.0",
  "ldap3>=2.9",
  "redis>=5.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "apscheduler>=3.10",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
